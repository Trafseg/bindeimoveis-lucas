<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B257D"><meta name="robots" content="noindex,nofollow">
<title>Encontre seu Imóvel | Bindé Imóveis</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Identidade visual — Bindé Imóveis (azul #0B257D + âmbar #F4A705) */
:root{--bg:#0A1F6B;--card:#122C85;--card-hover:#173493;--border:#25409A;--amber:#F4A705;--amber-light:#FFC23D;--ink:#0B257D;--green:#25D366;--text:#EEF2FF;--muted:#A3B1DE}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,Arial,sans-serif;color:var(--text);background:radial-gradient(ellipse at 90% 8%,rgba(244,167,5,.12),transparent 35%),radial-gradient(ellipse at 5% 60%,rgba(255,255,255,.05),transparent 50%),radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1.5px) 0 0/26px 26px,var(--bg);min-height:100svh}
body:before{content:'';display:block;height:6px;background:linear-gradient(90deg,var(--ink) 0%,#12339E 78%,var(--amber) 78%)}
button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:5px}
[hidden]{display:none!important}
.shell{max-width:1080px;margin:auto;padding:24px 32px 26px;min-height:calc(100svh - 6px);display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:16px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.brand img{width:76px;height:76px;object-fit:contain;border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.brand small{display:block;font-size:9px;color:var(--muted);font-weight:500;letter-spacing:2.4px;margin-top:3px}
.label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);padding:9px 13px;border-radius:99px;font-weight:600}
.progress-area{margin-top:28px}
.progress-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:10px}
.track{height:4px;background:var(--border);border-radius:10px;overflow:hidden}
.fill{width:0;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber-light));transition:width .35s}
main{flex:1;display:flex;align-items:center;padding:48px 0}
.screen{width:100%;max-width:650px;margin:auto;animation:enter .35s ease}
.welcome,.thanks{text-align:center;max-width:740px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(244,167,5,.35);background:rgba(244,167,5,.08);color:var(--amber);border-radius:99px;padding:7px 13px;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.eyebrow:before{content:'';width:6px;height:6px;background:var(--amber);border-radius:50%}
h1,h2{color:#fff;letter-spacing:-1px;line-height:1.25;margin:20px 0 16px;font-size:clamp(25px,4vw,39px);font-weight:800}
h1{font-size:clamp(23px,3.4vw,36px);letter-spacing:-1.2px}
h2{font-size:clamp(20px,2.8vw,28px);letter-spacing:-.6px}
h1 span,.accent{color:var(--amber)}
h1:focus,h2:focus{outline:none}
.desc{font-size:14px;line-height:1.8;color:var(--muted);margin:0 0 28px}
.welcome .desc,.thanks .desc{max-width:560px;margin:0 auto 28px}
.step-label{color:var(--amber);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.step-label b{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:9px;background:rgba(244,167,5,.15);margin-right:9px}
.primary{display:inline-flex;justify-content:center;align-items:center;gap:14px;border:0;background:var(--amber);color:var(--ink);font-size:14px;font-weight:700;padding:17px 24px;border-radius:12px;box-shadow:0 8px 24px rgba(244,167,5,.25);text-decoration:none;transition:transform .2s,background .2s}
.primary:hover{transform:translateY(-2px);background:var(--amber-light)}
.primary .arrow{font-size:20px}
#whatsapp{background:var(--green);color:#072812;box-shadow:0 8px 24px rgba(37,211,102,.25)}#whatsapp:hover{background:#1fbb5c}
.micro{font-size:11px;color:var(--muted);margin-top:15px;line-height:1.7}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.pill{color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:99px;padding:7px 11px;font-size:10px}
.pill:before{content:'●';color:var(--amber);margin-right:6px}
.field{width:100%;background:transparent;border:0;border-bottom:2px solid var(--border);border-radius:0;padding:14px 0;color:var(--text);font-size:clamp(20px,3vw,27px);outline:none;transition:border-color .2s}
.field::placeholder{color:#6F80BC}
.field:focus{border-color:var(--amber)}
.field[aria-invalid=true]{border-color:#FF8A8A}
.options{display:grid;gap:10px}
.option{display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:16px;background:var(--card);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:13px;line-height:1.6;transition:background .2s,border-color .2s,transform .2s}
.option:hover{border-color:var(--amber);background:var(--card-hover);transform:translateX(3px)}
.option[aria-checked=true]{border-color:var(--amber);background:rgba(244,167,5,.1);box-shadow:0 0 0 1px var(--amber)}
.key{flex-shrink:0;border:1px solid #3A55AE;border-radius:6px;width:27px;height:27px;display:grid;place-items:center;color:var(--amber);font-size:11px;font-weight:700}
.option[aria-checked=true] .key{color:var(--ink);background:var(--amber);border-color:var(--amber)}
.check{margin-left:auto;color:var(--amber);visibility:hidden}
.option[aria-checked=true] .check{visibility:visible}
.actions{display:flex;align-items:center;gap:18px;margin-top:26px}
.hint{color:var(--muted);font-size:11px}
.error{color:#FF8A8A;font-size:12px;min-height:19px;margin:12px 0 0}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;border-top:1px solid var(--border);padding-top:20px;color:var(--muted);font-size:10px}
.back,.restart{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:9px 13px;font-size:11px}
.back:hover,.restart:hover{color:#fff;border-color:var(--amber);background:var(--card)}
.success{width:68px;height:68px;margin:0 auto 22px;display:grid;place-items:center;border-radius:20px;background:rgba(244,167,5,.1);border:1px solid rgba(244,167,5,.4);font-size:30px;color:var(--amber)}
.summary{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin:24px 0}
.summary h3{font-size:12px;color:var(--amber);margin:0 0 12px}
.summary dl{margin:0}
.summary .row{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:11px;line-height:1.6}
.summary .row:last-child{border:0}
.summary dt{color:var(--muted)}.summary dd{margin:0;overflow-wrap:anywhere}
.restart{margin-top:18px}
@keyframes enter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:560px){.shell{padding:16px 20px 20px}.header{padding-bottom:16px}.header .label{display:none}.brand{font-size:17px;gap:12px}.brand img{width:58px;height:58px;border-radius:13px}.brand small{font-size:8px;letter-spacing:1.6px}main{padding:35px 0}.progress-area{margin-top:22px}h1,h2{letter-spacing:-.6px}.eyebrow{font-size:9px;padding:7px 10px}.primary{padding:16px 18px}.welcome .primary,.thanks .primary{width:100%}.thanks .primary{font-size:12px}.hint{display:none}.option{padding:13px;font-size:12px}.bottom{font-size:9px;flex-wrap:wrap}.summary .row{grid-template-columns:95px 1fr}.desc{font-size:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="progress-area" id="progressArea" hidden><div class="progress-meta"><span id="progressText"></span><span id="progressPercent"></span></div><div class="track" role="progressbar" aria-label="Progresso do formulário" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="fill" id="fill"></div></div></div>
<main id="main"></main>
<footer class="bottom"><span>Bindé Imóveis · A chave do seu próximo endereço</span><button class="back" id="back" hidden type="button">← Voltar</button><span id="footerNote">Rápido. Simples. Sem compromisso.</span></footer>
</div>
<noscript>Ative o JavaScript do navegador para responder ao formulário.</noscript>
<script>
'use strict';
// Configure antes de publicar: WhatsApp da imobiliária (país + DDD + número) e URL do webhook da planilha (Google Apps Script).
const WHATSAPP_NUMERO='5551989000632'; // Consultor Lucas Bindé
const PLANILHA_WEBHOOK='https://script.google.com/macros/s/AKfycbxz0AYLy609rOXapSuPhQi5iZKc2MnK3nBIvM32-DpOcYaLZmFdrfq7_U-VzWntENX_/exec'; // Apps Script do Lucas
const questions=[
 {id:'name',group:'Identificação e contato',title:'Como podemos chamar você?',label:'Nome completo',placeholder:'Digite seu nome completo',autocomplete:'name'},
 {id:'phone',group:'Identificação e contato',title:'Qual é o seu WhatsApp?',desc:'Informe seu número com DDD para que um corretor possa falar com você.',label:'WhatsApp com DDD',placeholder:'(51) 99999-9999',autocomplete:'tel-national',type:'tel'},
 {id:'occupation',group:'Seu perfil',title:'Qual sua ocupação hoje?',options:['Sou CLT/concursado','Sou autônomo','Sou aposentado/pensionista','Sou investidor']},
];
const LABELS={name:'Nome',phone:'WhatsApp',occupation:'Ocupação'};
const answers={};let step=0;let autoAdvanceTimer=null;
const main=document.getElementById('main'),back=document.getElementById('back');
const flow=()=>questions.filter(q=>!q.when||q.when(answers));
const totalSteps=()=>flow().length;
const track=(...args)=>{if(window.fbq)fbq(...args);};
const cookie=name=>(document.cookie.match('(?:^|; )'+name+'=([^;]*)')||[])[1]||'';
// Origem do lead: parâmetros de URL do anúncio da Meta (utm_content={{ad.name}} = imóvel anunciado)
const URL_PARAMS=new URLSearchParams(location.search);
// Nome amigável do imóvel na mensagem do WhatsApp, pelo código do anúncio (a planilha recebe o nome técnico completo)
const IMOVEIS={AD1:'Apartamento decorado em Porto Alegre',AD2:'Apartamento na Zona Norte (Av. Baltazar)',AD3:'Apartamento na Av. Vitor Hugo',AD4:'Apartamento na Zona Norte'};
const imovelAmigavel=ad=>IMOVEIS[(ad.match(/^AD\d+/i)||[''])[0].toUpperCase()]||ad;
const ORIGEM={ad:URL_PARAMS.get('utm_content')||'',adset:URL_PARAMS.get('utm_term')||'',campaign:URL_PARAMS.get('utm_campaign')||'',source:URL_PARAMS.get('utm_source')||''};
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function focusTitle(){main.querySelector('h1,h2')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function render(){
 clearTimeout(autoAdvanceTimer);autoAdvanceTimer=null;
 const list=flow(),total=totalSteps(),finished=step===list.length;
 document.getElementById('progressArea').hidden=false;back.hidden=step===0;document.getElementById('footerNote').hidden=step>0;
 const completed=finished?total:Math.max(0,step),pct=Math.round(completed/total*100);
 document.getElementById('progressText').textContent=finished?'Formulário concluído':'Etapa '+(step+1)+' de '+total;
 document.getElementById('progressPercent').textContent=pct+'%';
 document.getElementById('fill').style.width=pct+'%';
 document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',pct);
 if(finished){
 const rows=list.map(q=>[LABELS[q.id],q.id]);
 const intro='Olá, Lucas! Preenchi o formulário e gostaria de receber opções de imóveis para o meu perfil.';
 const message=intro+'\n\n'+rows.map(([label,id])=>label+': '+answers[id]).join('\n')+(ORIGEM.ad?'\nImóvel de interesse: '+imovelAmigavel(ORIGEM.ad):'');
 const whatsappLink='https://wa.me/'+WHATSAPP_NUMERO+'?text='+encodeURIComponent(message);
 const leadPhoneDigits=(answers.phone||'').replace(/\D/g,'');
 const payload={};for(const id of Object.keys(LABELS))payload[id]=list.some(q=>q.id===id)?answers[id]:'';
 payload.whatsappLink=leadPhoneDigits?'https://wa.me/55'+leadPhoneDigits:'';
 // Mesmo event_id no pixel e na API de Conversões (Apps Script) para a Meta não contar o lead duas vezes
 const eventId='lead-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
 Object.assign(payload,ORIGEM,{eventId,fbp:cookie('_fbp'),fbc:cookie('_fbc')||(new URLSearchParams(location.search).get('fbclid')?'fb.1.'+Date.now()+'.'+new URLSearchParams(location.search).get('fbclid'):''),pageUrl:location.href,userAgent:navigator.userAgent});
 track('track','Lead',{content_name:answers.occupation},{eventID:eventId});
 if(PLANILHA_WEBHOOK){fetch(PLANILHA_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).catch(()=>{});}
 const firstName=esc(answers.name.trim().split(/\s+/)[0]);
 const desc='Clique abaixo e envie a mensagem no WhatsApp. Um corretor vai separar as melhores opções de imóveis para o seu perfil.';
 main.innerHTML=`<section class="screen thanks"><div class="success" aria-hidden="true">✓</div><div class="eyebrow">Tudo pronto para o próximo passo</div><h1 tabindex="-1">Formulário concluído, <span>${firstName}!</span> 🎉</h1><p class="desc">${desc}</p><a class="primary" id="whatsapp" href="${esc(whatsappLink)}" target="_blank" rel="noopener noreferrer">💬 Falar agora com um corretor no WhatsApp</a><p class="micro">O atendimento começa depois que você envia a mensagem no WhatsApp.</p><div class="summary"><h3>CONFIRA SUAS RESPOSTAS</h3><dl>${rows.map(([label,id])=>`<div class="row"><dt>${label}</dt><dd>${esc(answers[id])}</dd></div>`).join('')}</dl></div><button class="restart" id="restart" type="button">Recomeçar formulário</button></section>`;
 document.getElementById('whatsapp').onclick=()=>track('track','Contact');
 document.getElementById('restart').onclick=()=>{for(const key of Object.keys(answers))delete answers[key];step=0;render();};
 }else{
 const q=list[step];
 main.innerHTML=`<section class="screen"><div class="step-label"><b>${step+1}</b>${q.group}</div><h2 id="questionTitle" tabindex="-1">${q.title}</h2>${q.desc?`<p class="desc" id="description">${q.desc}</p>`:''}<form id="questionForm" novalidate>${q.options?`<div class="options" role="radiogroup" aria-labelledby="questionTitle">${q.options.map((option,i)=>`<button type="button" class="option" role="radio" aria-checked="${answers[q.id]===option}" data-index="${i}" tabindex="${answers[q.id]===option||(!answers[q.id]&&i===0)?0:-1}"><span class="key" aria-hidden="true">${String.fromCharCode(65+i)}</span><span>${option}</span><span class="check" aria-hidden="true">✓</span></button>`).join('')}</div>`:`<input class="field" id="answer" aria-label="${q.label}" aria-describedby="description error" type="${q.type||'text'}" ${q.type==='tel'?'inputmode="tel"':''} autocomplete="${q.autocomplete}" maxlength="${q.type==='tel'?20:140}" placeholder="${q.placeholder}" value="${esc(answers[q.id])}" required>`}<p class="error" id="error" role="alert"></p><div class="actions"><button class="primary" type="submit">${step===list.length-1?'Concluir':'Continuar'} <span class="arrow" aria-hidden="true">→</span></button><span class="hint">pressione Enter ↵${q.options?' · ou escolha uma letra':''}</span></div></form></section>`;
 if(q.options){main.querySelectorAll('.option').forEach(button=>button.onclick=()=>selectOption(Number(button.dataset.index)));}
 else{const input=document.getElementById('answer');input.addEventListener('input',()=>{answers[q.id]=input.value;input.removeAttribute('aria-invalid');document.getElementById('error').textContent='';});if(q.type==='tel')input.addEventListener('input',()=>{let digits=input.value.replace(/\D/g,'');if(digits.startsWith('55')&&digits.length>11)digits=digits.slice(2);digits=digits.slice(0,11);input.value=digits.length>2?'('+digits.slice(0,2)+') '+digits.slice(2,digits.length>10?7:6)+(digits.length>6?'-'+digits.slice(digits.length>10?7:6):''):digits;answers[q.id]=input.value;});}
 document.getElementById('questionForm').onsubmit=event=>{event.preventDefault();advance();};
 }
 focusTitle();
}
function selectOption(index){const q=flow()[step];if(!q?.options?.[index])return;answers[q.id]=q.options[index];main.querySelectorAll('.option').forEach((button,i)=>{button.setAttribute('aria-checked',i===index);button.tabIndex=i===index?0:-1;});document.getElementById('error').textContent='';clearTimeout(autoAdvanceTimer);const selectedStep=step;autoAdvanceTimer=setTimeout(()=>{autoAdvanceTimer=null;if(step===selectedStep)advance();},400);}
function advance(){const q=flow()[step];let value=(answers[q.id]||'').trim(),error='';if(!value)error=q.options?'Selecione uma opção para continuar.':'Preencha este campo para continuar.';else if(q.id==='name'&&value.length<2)error='Informe seu nome.';else if(q.id==='phone'&&!/^[1-9]{2}\d{8,9}$/.test(value.replace(/\D/g,'')))error='Informe um número válido com DDD (10 ou 11 dígitos).';if(error){document.getElementById('error').textContent=error;const input=document.getElementById('answer');if(input){input.setAttribute('aria-invalid','true');input.focus();}return;}answers[q.id]=value;if(q.id==='phone')track('trackCustom','EtapaWhatsApp');step++;render();}
back.onclick=()=>{if(step>0){step--;render();}};
document.addEventListener('keydown',event=>{if(event.ctrlKey||event.altKey||event.metaKey||event.target.matches('input,textarea'))return;const q=flow()[step];if(q?.options){const key=event.key.toUpperCase();if(/^[A-D]$/.test(key)){const index=key.charCodeAt(0)-65;if(index<q.options.length){event.preventDefault();selectOption(index);main.querySelectorAll('.option')[index].focus();}}else if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(event.key)){event.preventDefault();const current=q.options.indexOf(answers[q.id]);const index=(Math.max(current,0)+(['ArrowDown','ArrowRight'].includes(event.key)?1:-1)+q.options.length)%q.options.length;selectOption(index);main.querySelectorAll('.option')[index].focus();}else if(event.key==='Enter'&&!event.target.matches('.primary,.back')){event.preventDefault();advance();}}});
track('track','ViewContent');
render();
</script>
</body>
